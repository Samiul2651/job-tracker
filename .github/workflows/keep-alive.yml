name: Keep database awake

# Supabase pauses free projects after a week without activity.
# This calls the app's health route once a day, which runs one small query.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health route
        env:
          APP_URL: ${{ vars.APP_URL || 'https://job-tracker-steel-phi.vercel.app' }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "APP_URL is empty"; exit 1
          fi
          curl --fail --silent --show-error --max-time 30 "$APP_URL/api/health"
